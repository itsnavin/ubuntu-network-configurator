# Expected: accepted, but netplan warns about conflicting default routes (same family, table and metric).
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      addresses: ["192.168.1.10/24"]
      routes:
        - to: "default"
          via: "192.168.1.1"
    eth1:
      addresses: ["192.168.2.10/24"]
      routes:
        - to: "default"
          via: "192.168.2.1"
