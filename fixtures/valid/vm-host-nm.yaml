# Generated offline by Ubuntu Network Configurator. REVIEW BEFORE USE.
# This file is merged with every other file in /etc/netplan, /run/netplan and /lib/netplan.
# Validate with "sudo netplan generate", test with "sudo netplan try" from a local console.
# Install with permissions 600 (root only): it may contain Wi-Fi passwords.
network:
  version: 2
  renderer: "NetworkManager"
  ethernets:
    "eno1":
      dhcp4: false
      dhcp6: false
    "eno2":
      dhcp4: false
      dhcp6: false
  bonds:
    "bond0":
      dhcp4: false
      dhcp6: false
      interfaces:
        - "eno1"
        - "eno2"
      parameters:
        mode: "802.3ad"
        lacp-rate: "fast"
        mii-monitor-interval: 100
        transmit-hash-policy: "layer3+4"
  bridges:
    "br0":
      dhcp4: false
      dhcp6: false
      addresses:
        - "10.10.0.5/24"
      nameservers:
        addresses:
          - "10.10.0.1"
      routes:
        - to: "default"
          via: "10.10.0.1"
      interfaces:
        - "vlan10"
      parameters:
        stp: false
        forward-delay: 0
  vlans:
    "vlan10":
      dhcp4: false
      dhcp6: false
      id: 10
      link: "bond0"
